name: Windows portable

# Builds Sensibilia-<version>-windows-portable.zip, starts it from a folder whose
# name has a space and a non-ASCII letter, and checks HTTPS, the tablet app, backup and shutdown.

on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:
    paths:
      - 'src/sensibilia/portable.py'
      - 'src/sensibilia/tablet_app.py'
      - 'src/sensibilia/analysis_setup.py'
      - 'src/sensibilia/analysis/**'
      - 'scripts/build_portable.py'
      - 'scripts/smoke_portable.py'
      - 'deploy/**'
      - 'android/**'
      - 'requirements.lock'
      - '.github/workflows/portable.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true

env:
  APKSIG_VERSION: 8.7.3
  # Published next to the jar at dl.google.com/dl/android/maven2/.../apksig-<version>.jar.sha256
  APKSIG_SHA256: c070ed1394629d74641aa0906f60b2ffa1ee77e6366a1f93437f59717b1aeb89

jobs:
  tablet-parts:
    # The template app has a placeholder root; every laboratory's root is swapped in locally.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Template app with a placeholder root
        working-directory: android
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /dev/null -out placeholder-root.crt \
            -days 3650 -subj "/CN=Sensibilia placeholder root"
          ./gradlew --no-daemon assembleDebug -PlabCa=placeholder-root.crt
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/template.apk"
          rm placeholder-root.crt
      - name: Signer (apksig, pinned)
        run: |
          curl -sSfL -o apksig.jar \
            "https://dl.google.com/dl/android/maven2/com/android/tools/build/apksig/${APKSIG_VERSION}/apksig-${APKSIG_VERSION}.jar"
          echo "${APKSIG_SHA256}  apksig.jar" | sha256sum -c -
          mkdir classes && (cd classes && jar xf ../apksig.jar)
          javac --release 17 -cp apksig.jar -d classes android/signer/Signer.java
          jar --create --file "$RUNNER_TEMP/signer.jar" --main-class Signer -C classes .
      - uses: actions/upload-artifact@v4
        with:
          name: tablet-parts
          path: |
            ${{ runner.temp }}/template.apk
            ${{ runner.temp }}/signer.jar
          retention-days: 7

  windows:
    needs: tablet-parts
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
      # The optional analysis add-on, installed from the lock exactly as a
      # laboratory would, so tests/test_analysis_recipes.py runs the real R recipes here.
      - name: Cache the analysis add-on downloads
        uses: actions/cache@v4
        with:
          path: build/analysis-download
          key: analysis-${{ hashFiles('src/sensibilia/analysis/r-runtime.lock.json') }}
      - name: Install the analysis add-on
        run: |
          python -m sensibilia.analysis_setup download build/analysis-download
          python -m sensibilia.analysis_setup install --from build/analysis-download
          python -m sensibilia.analysis_setup status
      - name: Pytest on Windows
        run: python -m pytest -q -p no:cacheprovider
      - uses: actions/download-artifact@v4
        with:
          name: tablet-parts
          path: tablet-parts
      - name: Java runtime for signing (java and keytool only)
        run: jlink --add-modules java.base --strip-debug --no-header-files --no-man-pages --output jre
      - name: Build the zip
        run: |
          python scripts/build_portable.py --out dist \
            --template-apk tablet-parts/template.apk --signer-jar tablet-parts/signer.jar --jre jre
      - name: Start it from a folder with a space and a non-ASCII letter
        run: python scripts/smoke_portable.py dist/Sensibilia-*-windows-portable.zip --tablet-app
      - uses: actions/upload-artifact@v4
        with:
          name: sensibilia-windows-portable
          path: dist/Sensibilia-*-windows-portable.zip
          retention-days: 30

  # On a version tag, publish the zip that was just built and smoke-tested as a GitHub Release.
  # Tags with a suffix (v0.1.0-rc1) become pre-releases. Never runs in the private repository.
  release:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v') && !endsWith(github.repository, '_dev')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sensibilia-windows-portable
          path: dist
      - name: Check the tag matches the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          tag="${GITHUB_REF_NAME#v}"
          if [ "${tag%%-*}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi
          zip="dist/Sensibilia-${version}-windows-portable.zip"
          test -f "$zip"
          (cd dist && sha256sum "$(basename "$zip")" > "$(basename "$zip").sha256")
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/Sensibilia-*-windows-portable.zip* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/Sensibilia-*-windows-portable.zip* \
              --verify-tag --title "Sensibilia $GITHUB_REF_NAME" --generate-notes "${prerelease[@]}"
          fi
