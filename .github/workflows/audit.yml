name: Audit

# Full browser suite with accessibility scans for every distinct UI state, plus
# gallery and density checks. Push and pull-request CI runs the fast tier (ci.yml).
on:
  schedule:
    - cron: '0 2 * * *'
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: .
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.lock
          .venv/bin/python -m pip install --no-deps -e .
          npm --prefix frontend ci
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright (full audit tier)
        run: npm run test:e2e
      - name: Upload audit captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-evidence
          path: frontend/test-evidence/
          retention-days: 30
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 14
