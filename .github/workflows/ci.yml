name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install locked dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.lock
          .venv/bin/python -m pip install --no-deps -e .
      - name: Ruff
        run: |
          .venv/bin/python -m ruff check .
          .venv/bin/python -m ruff format --check .
      - name: OpenAPI and flow contracts are current
        run: |
          .venv/bin/python scripts/export_contracts.py
          git diff --exit-code docs/contracts
      - name: Pytest
        run: .venv/bin/python -m pytest -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: .
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.lock
          .venv/bin/python -m pip install --no-deps -e .
          npm --prefix frontend ci
      - name: Generated API types are current
        run: |
          npm run contracts
          git diff --exit-code src/api-schema.d.ts
      - run: npm run typecheck
      - run: npm run check:controls
      - run: npm run format:check
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      # Fast tier: behaviour and data-integrity tests. Gallery/density/accessibility
      # audits (@audit) run in audit.yml nightly, on release tags and on demand.
      - name: Playwright (fast tier)
        run: npm run test:e2e:fast
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 14
