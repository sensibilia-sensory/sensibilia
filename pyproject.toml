[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sensibilia"
version = "0.1.3"
description = "Self-hosted sensory laboratory collection API"
license = "AGPL-3.0-or-later"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.143,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.8,<3",
  "SQLAlchemy>=2.0.38,<2.1",
  "alembic>=1.15,<2",
  # Excel and Word reports of analysis results; pure Python.
  "openpyxl>=3.1,<4",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx2>=2,<3", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sensibilia = ["analysis/*.json", "analysis/R/*.R", "analysis/R/recipes/*.R"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
